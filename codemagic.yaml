workflows:
  ios-simulator-build:
    name: iOS Simulator Build (no signing, validation only)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      node: latest
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Build for iOS Simulator (unsigned)
        script: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - ios/App/build/Build/Products/Debug-iphonesimulator/*.app

  # --- Not usable yet ---
  # Needs an Apple Developer Program membership + an App Store Connect API
  # key added in Codemagic under Teams > Integrations, named to match
  # `app_store_connect: word_solitaire_app_store` below (rename both sides
  # together if you pick a different name). Once that integration exists,
  # this workflow builds a signed .ipa and uploads it straight to
  # TestFlight — nothing else in this file needs to change.
  ios-testflight-release:
    name: iOS TestFlight Release (signed)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: word_solitaire_app_store
    environment:
      xcode: latest
      node: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hakeemsj.wordsolitaire
      vars:
        APP_ID: com.hakeemsj.wordsolitaire
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Fetch signing certificate and provisioning profile
        script: xcode-project use-profiles
      - name: Bump build number past the latest TestFlight build
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_ID")
          agvtool new-version -all $(($LATEST + 1))
      - name: Build and sign the .ipa
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-debug-build:
    name: Android Debug Build (no signing, validation only)
    max_build_duration: 30
    instance_type: linux
    environment:
      node: latest
      java: 17
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Sync Capacitor Android project
        script: npx cap sync android
      - name: Build debug APK (unsigned)
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

  # --- Not usable yet ---
  # Needs two things set up in the Codemagic dashboard first:
  #   1. An upload keystore under Team settings > Code signing identities >
  #      Android keystores, saved under the reference name
  #      `word_solitaire_upload_key` below (Codemagic can generate a new
  #      keystore for you right there — no local Java/keytool needed).
  #   2. A Google Play service account JSON key (Play Console > Setup >
  #      API access > create a service account with Release Manager
  #      permissions) added as an encrypted environment variable named
  #      GCLOUD_SERVICE_ACCOUNT_CREDENTIALS, inside an environment variable
  #      group named `google_play_credentials` below.
  # Field names for Android signing/publishing shift occasionally between
  # Codemagic versions — cross-check this against their current Android +
  # Google Play publishing docs before the first real run.
  android-playstore-release:
    name: Android Play Store Release (signed)
    max_build_duration: 60
    instance_type: linux
    environment:
      node: latest
      java: 17
      groups:
        - google_play_credentials
      android_signing:
        - word_solitaire_upload_key
      vars:
        PACKAGE_NAME: com.hakeemsj.wordsolitaire
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Sync Capacitor Android project
        script: npx cap sync android
      - name: Build and sign the .aab
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
